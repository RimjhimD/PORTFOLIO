<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-label="Animated n8n workflow: webhook trigger, normalize with code, qualify with an If node, then enrich and upsert into the CRM or notify the team and send a nurture email">
<title>n8n workflow automation — example flow</title>
<defs>
  <style>
    .mono { font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace; }
    .sans { font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif; }
    .dash { animation: flow 1.2s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -30; } }
    .live { transform-box: fill-box; transform-origin: center; animation: live 1.8s ease-out infinite; }
    @keyframes live { from { opacity: .8; transform: scale(1); } to { opacity: 0; transform: scale(2.6); } }
    @media (prefers-reduced-motion: reduce) { .dash, .live { animation: none; } }
  </style>
  <clipPath id="card"><rect width="1200" height="460" rx="22"/></clipPath>
